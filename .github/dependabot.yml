version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Flet 1.x is a breaking rewrite; flet_app.py targets the 0.28 API and
      # launcher.py pins flet[all]==0.28.3. Porting it is its own change.
      - dependency-name: "flet"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
